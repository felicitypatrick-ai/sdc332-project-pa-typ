name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is now out of date.
# Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Write test results to run summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Test results"
            echo
            if [ -f test-results.txt ]; then
              echo '```'
              cat test-results.txt
              echo '```'
            else
              echo "No test results were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release package
        run: python scripts/package.py

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantry-build-card2718
          path: dist/
          retention-days: 3
          if-no-files-found: error

  rule-check:
    name: Check the owner's rule (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every check finish and report, even if one of them fails.
      fail-fast: false
      matrix:
        check: [capacity, limit, line]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Built here as well so each check sees the same dist/ it saw before,
      # when it ran after the package build.
      - name: Build release package
        run: python scripts/package.py

      - name: Check the owner's rule (${{ matrix.check }})
        run: python scripts/rule_check.py ${{ matrix.check }}
